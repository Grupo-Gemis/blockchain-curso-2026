<script>
(() => {
  const payload = JSON.parse(document.querySelector('#contenido-cifrado').textContent);
  const locked = document.querySelector('#locked');
  const unlocked = document.querySelector('#unlocked');
  const viewer = document.querySelector('#viewer');
  const password = document.querySelector('#password');
  const button = document.querySelector('#open');
  const error = document.querySelector('#error');
  const decode = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));
  const aad = new TextEncoder().encode('utn-blockchain-cuestionarios-v1');
  function lock() {
    viewer.replaceChildren();
    unlocked.hidden = true;
    locked.hidden = false;
    document.body.classList.remove('opened');
    password.value = '';
    error.textContent = '';
  }
  document.querySelector('#unlock').addEventListener('submit', async event => {
    event.preventDefault();
    error.textContent = '';
    if (!globalThis.crypto?.subtle) {
      error.textContent = 'Abrí esta página mediante HTTPS en un navegador actualizado.';
      return;
    }
    button.disabled = true;
    button.textContent = 'Abriendo…';
    try {
      const material = await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']);
      const key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
      const clear = await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv),additionalData:aad,tagLength:128},key,decode(payload.data));
      const frame = document.createElement('iframe');
      frame.title = 'Respuestas explicadas de los diez cuestionarios';
      frame.setAttribute('sandbox','allow-scripts allow-modals allow-popups allow-popups-to-escape-sandbox');
      frame.srcdoc = new TextDecoder('utf-8',{fatal:true}).decode(clear);
      viewer.replaceChildren(frame);
      password.value = '';
      unlocked.hidden = false;
      locked.hidden = true;
      document.body.classList.add('opened');
      document.querySelector('#lock').focus();
    } catch {
      error.textContent = 'No se pudo abrir la guía. Revisá la contraseña y volvé a intentar.';
    } finally {
      button.disabled = false;
      button.textContent = 'Abrir guía docente';
    }
  });
  document.querySelector('#lock').addEventListener('click',()=>{lock();password.focus();});
  window.addEventListener('pagehide',lock);
})();
</script></body></html>

name: Comprobaciones
on: [push, pull_request]
jobs:
  laboratorio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laboratorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: laboratorio/package-lock.json
      - run: npm ci
      - run: npm run verificar
      - run: npm run compilar
      - run: npm test -- "Costos|Deployment"
